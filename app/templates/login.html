{% extends "base.html" %}
{% block title %}登录 · CRM 系统{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="card border-0 shadow-lg login-card">
    <div class="card-body p-4 p-md-5">
      <div class="brand-mark mb-3">C</div>
      <h1 class="h3 mb-2">CRM 系统</h1>
      <p class="text-secondary mb-4">面向小型服务团队的轻量客户管理</p>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label">手机号</label>
          <input class="form-control form-control-lg" name="phone" value="{{ phone or '' }}" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">密码</label>
          <input class="form-control form-control-lg" type="password" name="password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">登录</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
