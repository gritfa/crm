{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>用户管理</h1><p>管理员可以创建或停用团队账号</p></div></div>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h2 class="h5 mb-3">新增用户</h2>
      <form method="post" action="/users">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3"><label class="form-label">姓名</label><input class="form-control" name="name" required></div>
        <div class="mb-3"><label class="form-label">手机号</label><input class="form-control" type="tel" inputmode="numeric" name="phone" required></div>
        <div class="mb-3"><label class="form-label">初始密码</label><input class="form-control" type="password" name="password" minlength="8" required></div>
        <div class="mb-4"><label class="form-label">角色</label><select class="form-select" name="role"><option value="staff">员工</option><option value="admin">管理员</option></select></div>
        <button class="btn btn-primary w-100">创建账号</button>
      </form>
    </div></div>
  </div>
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm"><div class="table-responsive table-cards-wrap"><table class="table table-hover mb-0 table-cards">
      <thead><tr><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th></th></tr></thead>
      <tbody>{% for item in users %}<tr>
        <td class="fw-semibold cell-title">{{ item.name }}</td><td data-label="手机号">{{ item.phone }}</td><td data-label="角色">{{ '管理员' if item.role == 'admin' else '员工' }}</td>
        <td data-label="状态"><span class="badge {{ 'text-bg-success' if item.is_active else 'text-bg-secondary' }}">{{ '正常' if item.is_active else '停用' }}</span></td>
        <td class="text-end cell-actions"><form method="post" action="/users/{{ item.id }}/toggle"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-secondary" {% if item.id == current_user.id %}disabled{% endif %}>{{ '停用' if item.is_active else '启用' }}</button></form></td>
      </tr>{% endfor %}</tbody>
    </table></div></div>
  </div>
</div>
{% endblock %}
