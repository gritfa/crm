<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRM 系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  {% if current_user %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand fw-semibold" href="/">CRM 系统</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="/">首页</a>
          <a class="nav-link" href="/customers">客户</a>
          <a class="nav-link" href="/leads">线索</a>
          <a class="nav-link" href="/contracts">合同</a>
          <a class="nav-link" href="/payments">收款</a>
          {% if current_user.role == 'admin' %}<a class="nav-link" href="/users">用户</a>{% endif %}
        </div>
        <span class="navbar-text me-3">{{ current_user.name }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn-outline-light btn-sm" type="submit">退出</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container-fluid px-3 px-lg-4 py-4 content-shell">
    {% for item in flashes %}
      <div class="alert alert-{{ item.category }} alert-dismissible fade show" role="alert">
        {{ item.message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
