{% extends "base.html" %}
{% block title %}登记收款{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>登记收款</h1><p>选择合同并录入本次实际到账</p></div></div>
<div class="card border-0 shadow-sm form-card"><div class="card-body p-4">
  {% if contracts %}<form method="post" action="/payments">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row g-3">
      <div class="col-12"><label class="form-label">合同 *</label><select class="form-select" name="contract_id" required><option value="">请选择</option>{% for contract in contracts %}<option value="{{ contract.id }}" {% if selected_contract_id == contract.id %}selected{% endif %}>{{ contract.number }} · {{ contract.customer.name }} · 待收 {{ contract.outstanding_amount|money }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label">收款金额 *</label><input class="form-control" type="number" min="0.01" step="0.01" name="amount" required></div>
      <div class="col-md-6"><label class="form-label">收款日期 *</label><input class="form-control" type="date" name="paid_on" value="{{ today }}" required></div>
      <div class="col-md-6"><label class="form-label">收款方式</label><select class="form-select" name="method"><option value="bank">银行转账</option><option value="wechat">微信</option><option value="alipay">支付宝</option><option value="cash">现金</option><option value="other">其他</option></select></div>
      <div class="col-md-6"><label class="form-label">流水号</label><input class="form-control" name="reference"></div>
      <div class="col-12"><label class="form-label">备注</label><textarea class="form-control" name="notes" rows="3"></textarea></div>
    </div>
    <div class="d-flex gap-2 mt-4"><button class="btn btn-primary">保存</button><a class="btn btn-light" href="/payments">取消</a></div>
  </form>{% else %}<div class="text-center py-5"><p class="text-secondary">请先创建一份草稿或执行中的合同。</p><a class="btn btn-primary" href="/contracts/new">新增合同</a></div>{% endif %}
</div></div>
{% endblock %}
