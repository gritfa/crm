<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>当前无网络 · CRM 系统</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
           background: #f5f7fb; color: #1c2434;
           font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { text-align: center; max-width: 420px; }
    .mark { width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 18px; display: grid;
            place-items: center; color: #fff; font-size: 1.9rem; font-weight: 700;
            background: linear-gradient(135deg, #3157d5, #6d45d9); }
    h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
    p { color: #6c757d; line-height: 1.6; margin: 0 0 1.5rem; }
    button { min-height: 44px; padding: 0 1.6rem; border: 0; border-radius: .6rem; color: #fff;
             background: #3157d5; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">C</div>
    <h1>当前无网络连接</h1>
    <p>CRM 的客户和合同数据不会缓存在手机本地，需要联网才能查看。请检查网络后重试。</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
