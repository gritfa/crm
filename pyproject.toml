[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-system"
version = "0.1.0"
description = "A compact, Python-first CRM for small service teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.41.0",
  "SQLAlchemy==2.0.48",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.22",
  "Jinja2==3.1.6",
  "itsdangerous==2.2.0",
  "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*"]
